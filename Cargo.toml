[package]
name = "jj-agentic-proxy"
version = "0.13.1"
edition = "2021"
rust-version = "1.82"
description = "本机 agentic proxy: 复用自有订阅, 为其他 app 提供 Anthropic / OpenAI Codex 官方协议端点"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fs4 = { version = "1", default-features = false, features = ["sync"] }
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webbrowser = "1"
ruzstd = "0.9"

[profile.release]
strip = true

# 本仓库没有 lldb 断点调试的流程: debug 产物只服务 clippy / test / 编译期报错。
# dev 默认 `debug = 2` 在 macOS 上按 split-debuginfo = "unpacked" 落成 target/debug/deps 下
# 数万个 .o (改前实测 20231 个 / target/debug 7.9G; 改后同工况 256 个 / 565M)。
# line-tables-only 保住 panic backtrace 的
# 文件名 + 行号, 其余不生成; 依赖连行号都用不上, 整个关掉。
# 已经堆起来的产物用 scripts/clean.sh 清。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
